# gitleaks configuration: the default rules, plus one narrow allowance.
[extend]
useDefault = true

# SoundCloud "secret_token" values for Josh's private album sets. They are share tokens the
# embedded player needs in the browser, so they are public by design; see docs/ci/exceptions.md.
# Only the token shape, and only in the two files that hold the albums.
[[allowlists]]
description = "SoundCloud private-set share tokens (public by design)"
condition = "AND"
paths = ['''^src/content/releases\.ts$''', '''^src/lib/site\.ts$''']
regexTarget = "match"
regexes = ['''s-[A-Za-z0-9]{8,16}''']
